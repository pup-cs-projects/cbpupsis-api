# Checks the conventions a squash merge depends on. The PR title becomes the
# commit on its base branch, so it must follow Conventional Commits; the branch
# name and base branch must match CONTRIBUTING.md (story -> frNNN -> dev).
# Releases flow dev -> staging -> main,
# and a merge into staging or main deploys (deploy.yml).
#
# The organization is on the GitHub Free plan with private repositories, so
# branch protection cannot mark these checks as required. They still turn the
# PR red, and the team agreement is that nobody merges a red PR.

name: pr-conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The same list as CONTRIBUTING.md.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >
            The description "{subject}" must start with a lowercase letter and
            must not end with a period. Example: feat(auth): add account lockout

  branch:
    name: Branch name and base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check branch naming and target
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          # Story branches in this repository start with api-; the client uses web-.
          SIDE: api
        run: |
          fail() { echo "::error::$1"; exit 1; }
          fix='(bugfix|style|docs)/[a-z0-9][a-z0-9._-]*'
          case "$BASE_REF" in
            fr[0-9][0-9][0-9])
              echo "$HEAD_REF" | grep -Eq "^(${SIDE}-us-[a-z]+-[0-9]{3}|${SIDE}-${BASE_REF}-[a-z0-9][a-z0-9-]*|${fix})$" \
                || fail "Branch '$HEAD_REF' cannot target $BASE_REF. Use ${SIDE}-us-<module>-<nnn> (a story under this FR), ${SIDE}-${BASE_REF}-<name>, or bugfix/, style/, docs/."
              ;;
            dev)
              echo "$HEAD_REF" | grep -Eq "^(fr[0-9]{3}|${fix}|hotfix/[a-z0-9][a-z0-9._-]*|dependabot/.+)$" \
                || fail "Branch '$HEAD_REF' cannot target dev. Story branches target their FR branch (frNNN); only frNNN, bugfix/, style/, docs/, or hotfix/ target dev."
              ;;
            staging)
              echo "$HEAD_REF" | grep -Eq '^(dev|hotfix/[a-z0-9][a-z0-9._-]*)$' \
                || fail "Only dev (a release candidate) or a hotfix/ branch may target staging. Retarget this PR to dev."
              ;;
            main)
              echo "$HEAD_REF" | grep -Eq '^(staging|hotfix/[a-z0-9][a-z0-9._-]*)$' \
                || fail "Only staging (a release tested on staging) or a hotfix/ branch may target main. Retarget this PR to dev."
              ;;
            *)
              fail "PRs target an FR branch (frNNN) or dev. This one targets '$BASE_REF'."
              ;;
          esac
          echo "ok: $HEAD_REF -> $BASE_REF"
