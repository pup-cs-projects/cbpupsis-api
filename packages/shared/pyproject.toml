[project]
name = "cbpupsis-shared"
version = "0.1.0"
description = "Cross-role domains, the outbox and its worker, and the application factory"
requires-python = ">=3.12"
dependencies = [
    "cbpupsis-core",
    "cbpupsis-database",
    "fastapi",
    "pydantic[email]",
    "sqlalchemy[asyncio]",
    # The outbox wake-up listener holds a raw asyncpg connection for LISTEN.
    "asyncpg",
    "pyjwt",
    "passlib[argon2]",
    "scalar-fastapi>=1.8.2",
    # The IANA time zone database for `zoneinfo`, which validates the user
    # profile's timezone field. Required, not optional: Windows ships no system
    # tz database at all, and slim Linux images routinely omit it, and without this
    # `zoneinfo` finds zero zones and rejects every valid input.
    "tzdata",
]

[tool.uv.sources]
cbpupsis-core = { workspace = true }
cbpupsis-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
