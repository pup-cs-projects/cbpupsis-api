[project]
name = "cbpupsis-database"
version = "0.1.0"
description = "The declarative base, the async session, and every SQLAlchemy model"
requires-python = ">=3.12"
dependencies = [
    "cbpupsis-core",
    "sqlalchemy[asyncio]",
    "asyncpg",
]

[tool.uv.sources]
cbpupsis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
