[project]
name = "cbpupsis-api-student"
version = "0.1.0"
description = "CBPUPSIS student API"
requires-python = ">=3.12"
dependencies = [
    "cbpupsis-core",
    "cbpupsis-database",
    "cbpupsis-shared",
    "fastapi",
    "pydantic",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
    "reportlab>=4.4.0,<5",
    "icalendar>=6.3.0,<8",
    "httpx>=0.28,<1",
    "cryptography>=46.0.0",
    "pyjwt",
]

[tool.uv.sources]
cbpupsis-core = { workspace = true }
cbpupsis-database = { workspace = true }
cbpupsis-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
