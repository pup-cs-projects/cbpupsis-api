# Staging overlay: docker compose -f docker-compose.yml -f docker-compose.staging.yml
#
# Runs the SAME builds as production against the local Postgres, so you can
# verify the shipping artifacts rather than the dev images. Differences from dev
# are all configuration: docs closed, structured logs, no reload, non-root, no
# bind mount.
#
# The Makefile applies this automatically with `env=staging`.

# No bind mount on any service: the image is the artifact under test, so a host
# edit must not silently change what is running. `!reset` because a plain `[]`
# is merged with the base file's list and removes nothing. It is repeated per
# service because Compose does not apply it through a YAML merge key.

# The overlay every app service gets.
x-staging-app: &staging-app
  depends_on:
    redis:
      condition: service_healthy

# Rate limit counters in Redis, not in the process.
#
# With the default `memory://` each worker keeps its own counters, so a limit of
# "10/minute" is really 10 x the worker count and resets on every deploy, so the
# limit silently weakens exactly as you scale out. Staging runs the production
# image with more than one worker, so it is the first place that divergence is
# observable, which is why the override lives here and dev is left alone.
#
# Set after env_file, so it wins over whatever env/<app>/env.staging carries. Each app
# shares the one Redis, so a caller's login attempts count across all three.
x-redis-limits: &redis-limits
  RATE_LIMIT_STORAGE_URI: redis://redis:6379/0

services:
  migrate:
    build:
      dockerfile: docker/admin/Dockerfile.staging
    volumes: !reset []

  worker:
    build:
      dockerfile: docker/admin/Dockerfile.staging
    volumes: !reset []

  api-student:
    <<: *staging-app
    volumes: !reset []
    build:
      dockerfile: docker/student/Dockerfile.staging
    environment:
      <<: *redis-limits

  api-faculty:
    <<: *staging-app
    volumes: !reset []
    build:
      dockerfile: docker/faculty/Dockerfile.staging
    environment:
      <<: *redis-limits

  api-admin:
    <<: *staging-app
    volumes: !reset []
    build:
      dockerfile: docker/admin/Dockerfile.staging
    environment:
      <<: *redis-limits

  redis:
    image: redis:7-alpine
    # No persistence and no password: these counters are disposable, rebuild
    # themselves within one window, and this port is not published to the host.
    # A deployed Redis holding anything else needs both.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # depends_on alone waits only for the container to start, not for Redis to
    # accept commands — the same trap as Postgres above.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
