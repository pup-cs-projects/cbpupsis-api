# Local development stack: the API plus a Postgres to develop against.
#
#   docker compose up            start everything (API on :8000)
#   docker compose logs -f api   follow the API logs
#   docker compose exec api sh   a shell inside the container
#   docker compose down          stop; add -v to also drop the database
#
# The API is bind-mounted, so an edit on the host reloads the container. The
# database is a named volume, so it survives `down` but not `down -v`.
#
# Production and staging do NOT use this file — those images are deployed by an
# orchestrator with its own configuration. See docker/README.md.

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      # Real values live in env/, which is gitignored. ENV_FILE is set by the
      # Makefile from `env=dev|staging`, so one compose file serves both without
      # duplicating the variable list.
      - ../env/env.${ENV_FILE:-dev}
    volumes:
      # Source is live-mounted; the venv lives at /opt/venv in the dev image so
      # this mount cannot shadow it. Relative to THIS file, so `..` is the app.
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
    # Wait for Postgres to accept connections, run migrations, then serve. Without
    # the migration step you get a container that starts and 500s on every request.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"

  worker:
    # The outbox relay. Same image and same code as the API — only the command
    # differs, which is what makes "one worker, all handlers" cheap: a new
    # handler is a new subscriber, not a new container.
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    env_file:
      - ../env/env.${ENV_FILE:-dev}
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
    # No port mapping and no health check: nothing connects to it. Liveness is
    # the process itself — if it exits, compose (and ECS) restart it — and the
    # signal to alert on is the `oldest_pending_seconds` field in its heartbeat
    # log, not whether it is up. A worker wedged on a poison message keeps
    # running and looks perfectly healthy.
    command: python -m app.worker

  db:
    # PostgreSQL 16, the version SRS 5.3 requires and the one Aurora PostgreSQL
    # will run. Developing against a different major than you deploy to is how
    # a migration passes locally and fails on deploy: majors change planner
    # behaviour, add reserved words, and alter what autogenerate emits.
    image: postgres:16-alpine
    # Inline, not env_file: these are the local container's own credentials, not
    # application config. They must match the DATABASE_URL in env/env.$(env),
    # and they are deliberately not secret, because this database exists only on your
    # machine and is destroyed by `make down wipe=1`.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      # Exposed so a GUI client on the host can connect. Drop this line if you
      # do not need one.
      - "5432:5432"
    volumes:
      # .../data is the data directory for Postgres 17 and earlier. The 18+
      # images moved it to /var/lib/postgresql and refuse to start on the old
      # path, so change this line together with the image major.
      - pgdata:/var/lib/postgresql/data
    # depends_on alone only waits for the container to start, not for Postgres to
    # be ready to accept connections, hence the healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
