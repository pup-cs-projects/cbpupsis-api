# Local development stack: the three API apps, the outbox worker, and a Postgres.
#
#   docker compose up                   start everything
#   docker compose logs -f api-student  follow one app's logs
#   docker compose exec api-admin sh    a shell inside one app's container
#   docker compose down                 stop; add -v to also drop the database
#
#   api-student  http://localhost:8001   auth, users, notifications, items
#   api-faculty  http://localhost:8002   auth, users, notifications
#   api-admin    http://localhost:8003   auth, users, notifications, iam, audit
#
# The source is bind-mounted, so an edit on the host reloads the apps. The
# database is a named volume, so it survives `down` but not `down -v`.
#
# Production and staging do NOT use this file — those images are deployed by an
# orchestrator with its own configuration. See docker/README.md.

name: cbpupsis-api

# Each app reads its own file, env/<app>/env.<stage>, which is gitignored.
# ENV_FILE is set by the Makefile from `env=dev|staging`, so one compose file
# serves both. The migrate service and the worker run the admin image, so they
# read the admin file. DATABASE_URL, DIRECT_DATABASE_URL, AUDIT_RUNTIME_ROLE,
# and JWT_SECRET must each be consistent across the files; DATABASE_URL uses
# the restricted API role, while DIRECT_DATABASE_URL uses the migration owner.

# What every container that runs workspace code shares.
x-workspace: &workspace
  volumes:
    # Source is live-mounted; the venv lives at /opt/venv in the dev image so
    # this mount cannot shadow it. Relative to THIS file, so `..` is the repo.
    - ..:/app

# The admin image also carries the migrations and scripts/, so the one-shot
# migration, the outbox worker, and the Makefile's seed scripts run from it.
x-admin-build: &admin-build
  context: ..
  dockerfile: docker/admin/Dockerfile.dev

# Each app starts only after the one-shot migration has finished. Without that
# you get containers that start and 500 on every request.
x-app-depends: &app-depends
  migrate:
    condition: service_completed_successfully

services:
  migrate:
    # Runs `alembic upgrade head` once and exits, so three app containers never
    # race each other to migrate the same database. Also the container the
    # Makefile runs one-off scripts in (seeds, create-admin), with the command
    # overridden.
    <<: *workspace
    env_file: ../env/admin/env.${ENV_FILE:-dev}
    build: *admin-build
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head

  api-student:
    <<: *workspace
    env_file: ../env/student/env.${ENV_FILE:-dev}
    build:
      context: ..
      dockerfile: docker/student/Dockerfile.dev
    ports:
      - "8001:8001"
    depends_on: *app-depends

  api-faculty:
    <<: *workspace
    env_file: ../env/faculty/env.${ENV_FILE:-dev}
    build:
      context: ..
      dockerfile: docker/faculty/Dockerfile.dev
    ports:
      - "8002:8002"
    depends_on: *app-depends

  api-admin:
    <<: *workspace
    env_file: ../env/admin/env.${ENV_FILE:-dev}
    build: *admin-build
    ports:
      - "8003:8003"
    depends_on: *app-depends

  worker:
    # The outbox relay, for every app: the handlers live in the shared package,
    # so one worker delivers what any app staged. A new handler is a new
    # subscriber, not a new container.
    <<: *workspace
    env_file: ../env/admin/env.${ENV_FILE:-dev}
    build: *admin-build
    depends_on: *app-depends
    # No port mapping and no health check: nothing connects to it. Liveness is
    # the process itself — if it exits, compose (and ECS) restart it — and the
    # signal to alert on is the `oldest_pending_seconds` field in its heartbeat
    # log, not whether it is up. A worker wedged on a poison message keeps
    # running and looks perfectly healthy.
    command: python -m cbpupsis_shared.worker

  db:
    # PostgreSQL 16, the version SRS 5.3 requires and the one Aurora PostgreSQL
    # will run. Developing against a different major than you deploy to is how
    # a migration passes locally and fails on deploy: majors change planner
    # behaviour, add reserved words, and alter what autogenerate emits.
    image: postgres:16-alpine
    # Inline, not env_file: these are the local container's own credentials, not
    # application config. App DATABASE_URL uses the app_runtime role created by
    # the init script; migration DIRECT_DATABASE_URL uses postgres locally.
    # and they are deliberately not secret, because this database exists only on your
    # machine and is destroyed by `make down wipe=1`.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb/10-runtime-role.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
